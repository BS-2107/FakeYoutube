<!DOCTYPE html>
<html>
    <head>
        <title>
            Exercise
        </title>
        <style>
            .top{
                display:flex;
                flex-direction: row;
                background-color:rgb(142, 42, 142);
                justify-content:space-between;
                height:50px;
                align-items:center;

            }
            .search{
                width:100%;
                height:25px;
                border-radius:20px;
                border:none;
                padding-left:20px;
                flex:1fr;
                margin-left:50px;
                margin-right:60px;
                max-width:400px;
            }
            .text{
                margin-left:15px;   
                color:white;
                font-weight:bold;

            }
            .button{
                padding-left:10px;
                padding-right:10px;
                margin-right:15px;
                border-width:1.5px;
                border-color:white;
                border-style:solid;
                border-radius:2px;
                height:30px;
                background-color:purple;
                color:white;
            }
        </style>
    </head>

    <body>
        <div class="top">
            <div>
                <p class="text">Home</p>
            </div>
            <div class>
                <input class="search" type="text" placeholder="Search"> 
            </div>
            <div>
                <button class="button">
                    Download
                </button>
            </div>
        </div>
    </body>
</html>
