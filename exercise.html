<!DOCTYPE html>
<html>
    <head>
        <style>
            .pic{
                width:100px;
                height:100px;
                object-fit:cover;
                object-position:center;
                border-radius:50px;
            }
            .bar{
                width:350px;
                height:25px;
                border-radius:150px;
                border:none;
                padding-left:15px;
                box-shadow: 0px 0px 4px rgba(0,0,0,0.4);
            }
        </style>

    </head>
    <body>
        <img class="pic" src="thumbnail/thumbnail-1.webp" >
        <input class="bar" type="text" placeholder="Search Google or type a URL">

    </body>
</html>
